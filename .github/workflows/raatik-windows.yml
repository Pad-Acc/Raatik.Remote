name: raatik-windows

# Manual only. This job takes 40-60 minutes because vcpkg compiles ffmpeg, aom,
# libvpx, libyuv, opus and mfx-dispatch from source. Triggering it on every push
# would burn hours of wall-clock on commits that raatik-check already validates.
# Run it deliberately: gh workflow run raatik-windows --ref raatik/ui-2026.07.01
on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "2026.07.01"
  # flutter_rust_bridge codegen inputs (see .github/workflows/bridge.yml) — the Windows
  # build consumes src/bridge_generated.rs and flutter/lib/generated_bridge.dart, which are
  # gitignored and must be generated in CI, not shipped in the tree.
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  # Generates the flutter_rust_bridge files that build-windows's cargo/flutter build steps
  # require. Upstream's build-for-windows-flutter job (flutter-build.yml:80) depends on this
  # same generation via its "generate-bridge" job + "Restore bridge files" step; the brief's
  # single-job sketch omitted it, which would fail cargo build with missing
  # src/bridge_generated.rs after the ~40min vcpkg install. Mirrors bridge.yml's
  # "bridge-artifact" matrix entry (Flutter 3.22.3, the one used by every non-arm64 target).
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.75
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # extended_text 14 needs a newer Dart than Flutter 3.22.3 ships; downgrade for resolution.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-windows:
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $flutterBin = Split-Path (Get-Command flutter).Source
          $flutterRoot = Split-Path $flutterBin
          $engineDir = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          Write-Host "flutterRoot: $flutterRoot"
          Write-Host "engineDir: $engineDir"
          if (-not (Test-Path $engineDir)) {
            Write-Error "Expected windows-x64-release engine artifacts at $engineDir but they are missing (flutter precache did not populate this path, or 'flutter' on PATH resolved to an unexpected install)."
            exit 1
          }
          Move-Item -Force windows-x64-release\* $engineDir\
          Get-ChildItem $engineDir

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.75
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Build
        run: python3 .\build.py --portable --flutter --hwcodec --vram

      - name: Verify runtime icons
        run: |
          python3 raatik/verify_windows_icons.py --release-dir ./flutter/build/windows/x64/runner/Release

      - name: Brand-leak gate
        shell: bash
        run: |
          python3 raatik/no_leak_gate.py \
            ./flutter/build/windows/x64/runner/Release/raatikdesk.exe \
            ./RaatikDesk-${{ env.VERSION }}-install.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: raatikdesk-windows-x86_64
          path: ./*install.exe
          if-no-files-found: error
